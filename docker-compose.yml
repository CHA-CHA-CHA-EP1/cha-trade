services:
  postgres:
    image: postgres:16-alpine
    container_name: cha-trade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cha_trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cha_trade_password}
      POSTGRES_DB: ${POSTGRES_DB:-cha_trade}
    ports:
      - "5456:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cha_trade}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cha-trade-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: cha-trade-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - cha-trade-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cha-trade-kafka-ui
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cha-trade
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cha-trade-network

  adminer:
    image: adminer:latest
    container_name: cha-trade-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cha-trade-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local

networks:
  cha-trade-network:
    driver: bridge
