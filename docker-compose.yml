version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cha-trade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cha_trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cha_trade_password}
      POSTGRES_DB: ${POSTGRES_DB:-cha_trade}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cha_trade}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cha-trade-network

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: cha-trade-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - cha-trade-network

volumes:
  postgres_data:
    driver: local

networks:
  cha-trade-network:
    driver: bridge
