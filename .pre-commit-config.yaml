repos:
  - repo: local
    hooks:
      - id: check-branch-name
        name: Check branch naming convention
        language: script
        entry: .githooks/check-branch-name.sh
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: check-no-direct-release-commit
        name: Block direct commit to release branch
        language: script
        entry: .githooks/check-release-branch.sh
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: check-commit-message
        name: Check commit message format
        language: script
        entry: .githooks/check-commit-msg.sh
        stages: [commit-msg]
        always_run: true
        pass_filenames: false
