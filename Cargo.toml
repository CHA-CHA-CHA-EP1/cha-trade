[workspace]
resolver = "3"
members = ["services/account", "services/auth", "services/order"]

[workspace.dependencies]
actix-web = "4.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.12.3"
